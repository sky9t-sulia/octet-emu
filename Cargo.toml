[package]
name = "octet-emu"
description = "Cycle-accurate NES emulator, as a C-callable and JNI-callable library."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "octet_emu"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["std", "snapshot"]
std = []

# Save states. A separate feature so the pure emulation logic can still be
# vendored dependency-free; the library itself always turns it on.
snapshot = ["dep:serde", "dep:postcard"]

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"], optional = true }
jni = "0.21"
